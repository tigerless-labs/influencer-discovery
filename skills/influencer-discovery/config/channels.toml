# Channel list and crawl parameters. Travels with the code.
# Per-install values (target sheet id, credentials) live in ~/.config/outreach/, not here.
#
# `methodology` points at the document under skills/outreach/reference/methodology/.
# The tier is derived from that path — the directory name is the sole authority on tier;
# no second copy of the tier number is stored here.

# How many times the target count the candidate pool holds. People judged unqualified do
# not consume the target, so the pool must be deep enough to fill it.
pool_factor = 25

[podcast]
methodology = "3-personal-site/podcast.md"
terms = ["indie hacker", "developer tools", "ai coding", "software engineering daily", "product builders"]

[newsletter]
methodology = "3-personal-site/newsletter.md"
categories = ["Technology", "Business"]
max_pages = 2

[blog]
methodology = "3-personal-site/self-hosted.md"
terms = ["AI", "LLM", "AI agents", "machine learning", "prompt engineering", "inference", "fine-tuning", "RAG"]

[devto]
methodology = "2-blog-platform/dev-to.md"
tags = ["ai", "productivity", "devtools", "programming", "opensource", "webdev"]

[freecodecamp]
methodology = "5-media/freecodecamp-news.md"

[hashnode]
methodology = "2-blog-platform/hashnode.md"
tags = ["ai", "productivity", "developer-tools", "programming", "web-development"]

[wordpress]

# Word list for the topic gate. A hit counts as relevant; the matched word is kept as evidence.
# Words match as whole words, never substrings — otherwise "ai" would hit email / chair / maintain.

[ai]
terms = [
  "ai", "a.i.", "artificial intelligence", "agi", "genai", "generative ai",
  "llm", "llms", "large language model", "gpt", "chatgpt", "openai", "anthropic",
  "claude", "gemini", "llama", "mistral", "deepseek", "qwen", "grok", "copilot",
  "machine learning", "deep learning", "neural network", "neural networks",
  "transformer", "transformers", "diffusion", "stable diffusion", "midjourney",
  "computer vision", "nlp", "natural language processing", "speech recognition",
  "prompt engineering", "prompting", "rag", "retrieval augmented", "embeddings",
  "vector database", "fine-tuning", "finetuning", "inference", "quantization",
  "agentic", "ai agent", "ai agents", "multi-agent", "langchain", "llamaindex",
  "hugging face", "huggingface", "ollama", "vllm", "pytorch", "tensorflow",
  "mlops", "ml engineer", "data science", "ai tools", "ai coding", "vibe coding",
  "cursor", "copilot", "codex", "claude code", "ai writing", "ai art",
]

# These words do not count on their own — too generic; they only mean something
# alongside a word from the list above
weak = ["model", "models", "agent", "agents", "training", "dataset", "automation"]

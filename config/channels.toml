# 渠道清单与抓取参数。随代码走。
# 随安装走的值(目标表标识、凭据)住 ~/.config/outreach/,不在这里。
#
# `methodology` 指向 skills/outreach/reference/methodology/ 下的那份文档。
# 档位由这条路径推出 —— 目录名是档位的唯一权威源,这里不存第二份档位号。

# 候选池取目标数的多少倍。判不合格的人不消耗目标数,池子要够深才凑得够。
pool_factor = 25

[podcast]
methodology = "3-personal-site/podcast.md"
terms = ["indie hacker", "developer tools", "ai coding", "software engineering daily", "product builders"]

[newsletter]
methodology = "3-personal-site/newsletter.md"
categories = ["Technology", "Business"]
max_pages = 2

[blog]
methodology = "3-personal-site/self-hosted.md"
terms = ["AI", "LLM", "AI agents", "machine learning", "prompt engineering", "inference", "fine-tuning", "RAG"]

[devto]
methodology = "2-blog-platform/dev-to.md"
tags = ["ai", "productivity", "devtools", "programming", "opensource", "webdev"]

[freecodecamp]
methodology = "2-blog-platform/freecodecamp-news.md"

[hashnode]
methodology = "2-blog-platform/hashnode.md"
tags = ["ai", "productivity", "developer-tools", "programming", "web-development"]

[wordpress]
methodology = "2-blog-platform/wordpress-com.md"
tags = ["technology", "productivity", "software", "writing"]

[microblog]
methodology = "2-blog-platform/micro-blog.md"

[mastodon]
methodology = "1-social/mastodon.md"
hosts = ["mastodon.social", "fosstodon.org", "hachyderm.io", "indieweb.social",
         "sigmoid.social", "mas.to", "techhub.social", "social.coop", "mstdn.social",
         "infosec.exchange", "ioc.exchange", "floss.social"]
max_offset = 480

[reddit]
methodology = "1-social/reddit.md"
subreddits = ["SideProject", "IndieBiz", "selfhosted", "webdev"]

[instagram]
methodology = "1-social/instagram.md"
terms = [
  "ai", "ai agent", "ai creator", "ai educator", "ai newsletter", "ai automation",
  "llm", "prompt engineering", "machine learning", "genai", "ai art", "ai video",
  "ai marketing", "ai productivity", "ai research", "data science", "chatgpt",
  "midjourney", "ai founder", "ai builder", "no code ai", "ai writer",
]
credit_budget = 400

[tiktok]
methodology = "1-social/tiktok.md"
terms = ["ai tools", "ai agents", "llm", "prompt engineering", "ai coding", "machine learning"]
credit_budget = 400

[threads]
methodology = "1-social/threads.md"
terms = [
  "ai", "ai agents", "ai tools", "llm", "prompt engineering", "ai coding",
  "machine learning", "genai", "ai newsletter", "ai art", "chatgpt", "claude",
  "ai builder", "ai research", "data science", "ai automation",
]
credit_budget = 400

[youtube]
methodology = "1-social/youtube.md"
terms = [
  "ai tools", "ai agents", "llm", "prompt engineering", "ai coding", "machine learning",
  "generative ai", "ai news", "ai automation", "chatgpt tutorial", "claude ai",
  "ai for developers", "ai productivity", "rag tutorial", "fine tuning llm",
]

# 渠道清单与抓取参数。随代码走。
# 随安装走的值(目标表标识、凭据)住 ~/.config/outreach/,不在这里。
#
# `methodology` 指向 skills/outreach/reference/methodology/ 下的那份文档。
# 档位由这条路径推出 —— 目录名是档位的唯一权威源,这里不存第二份档位号。

# 候选池取目标数的多少倍。判不合格的人不消耗目标数,池子要够深才凑得够。
pool_factor = 25

[podcast]
methodology = "3-personal-site/podcast.md"
terms = ["indie hacker", "developer tools", "ai coding", "software engineering daily", "product builders"]

[newsletter]
methodology = "3-personal-site/newsletter.md"
categories = ["Technology", "Business"]
max_pages = 2

[blog]
methodology = "3-personal-site/self-hosted.md"
terms = ["AI", "LLM", "AI agents", "machine learning", "prompt engineering", "inference", "fine-tuning", "RAG"]

[devto]
methodology = "2-blog-platform/dev-to.md"
tags = ["ai", "productivity", "devtools", "programming", "opensource", "webdev"]

[freecodecamp]
methodology = "5-media/freecodecamp-news.md"

[hashnode]
methodology = "2-blog-platform/hashnode.md"
tags = ["ai", "productivity", "developer-tools", "programming", "web-development"]

[wordpress]
methodology = "2-blog-platform/wordpress-com.md"
tags = ["technology", "productivity", "software", "writing"]

[microblog]
methodology = "2-blog-platform/micro-blog.md"

[mastodon]
methodology = "1-social/mastodon.md"
hosts = ["mastodon.social", "fosstodon.org", "hachyderm.io", "indieweb.social",
         "sigmoid.social", "mas.to", "techhub.social", "social.coop", "mstdn.social",
         "infosec.exchange", "ioc.exchange", "floss.social", "mastodon.world",
         "mstdn.party", "toot.community", "mastodon.online", "mastodon.cloud",
         "fediscience.org", "scholar.social", "hci.social", "vis.social",
         "genart.social", "mastodon.art", "writing.exchange", "journa.host"]
max_offset = 2000

[reddit]
methodology = "1-social/reddit.md"
subreddits = [
  "LocalLLaMA", "LLMDevs", "AI_Agents", "PromptEngineering", "ClaudeAI", "OpenAI",
  "ChatGPTPro", "artificial", "ArtificialInteligence", "MachineLearning",
  "aipromptprogramming", "AIAssisted", "WritingWithAI", "vibecoding", "ClaudeCode",
  "LangChain", "mcp", "RAG", "n8n", "Substack", "beehiiv", "NewsletterCreators",
]
terms = [
  "ai agents", "llm", "prompt engineering", "ai tools", "machine learning",
  "generative ai", "ai coding", "rag", "fine-tuning", "ai newsletter",
  "ai automation", "vibe coding", "claude code", "self hosted", "devops",
  "open source", "developer tools", "saas", "indie dev", "web development",
]
# 早先实验已抓好的资料页外链。抓过的不再抓第二遍,见 docs/design/records.md。
profile_dumps = ["data/experiments/2026-08-06/reddit-raw/profiles.jsonl"]


# Logical field → header text. Travels with the code.
# The target sheet id and credentials travel with the install and live in ~/.config/outreach/.env:
#   OUTREACH_SPREADSHEET_ID
# The tab's gid is looked up from the API at runtime, not stored here — storing it would
# silently point at the wrong tab after a rename or a move.

tab = "Target List"

[columns]
display_name = "Name"
channel = "Platform"
profile_url = "Link"
contact = "Contact"
contact_kind = "Contact Type"
status = "Status"
